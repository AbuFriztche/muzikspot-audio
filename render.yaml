services:
  - type: web
    name: muzikspot-audio
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /readyz
    autoDeployTrigger: off
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "8080"
      - key: AUDIO_BACKEND_TOKEN
        sync: false
